<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台导航</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1419;
    color: #e4e7eb;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .nav {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 320px;
  }
  .nav-card {
    display: block;
    background: #1a2029;
    border: 1px solid #2d3640;
    border-radius: 10px;
    padding: 20px;
    text-decoration: none;
    color: #e4e7eb;
    transition: border-color 0.2s, background 0.2s;
  }
  .nav-card:hover { border-color: #3b82f6; background: #232b36; }
  .nav-card h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .nav-card p { font-size: 13px; color: #8a94a6; }
</style>
</head>
<body>
<div class="nav">
  <a class="nav-card" href="/stock-review/market-review/">
    <h2>📊 股票复盘</h2>
    <p>每日股票复盘工作台</p>
  </a>
  <a class="nav-card" href="/stock-review/life-manager/">
    <h2>📋 生活管理</h2>
    <p>待开发</p>
  </a>
</div>
</body>
</html>
